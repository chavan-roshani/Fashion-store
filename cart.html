<!DOCTYPE html>
<html>
<head>
    <title>cart</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f4f4;
        }

        /* Navbar */
        .navbar {
            background: #111;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background: orange;
            padding: 8px 15px;
            border-radius: 5px;
        }

        .navbar a:hover {
            background: darkorange;
        }

        /* Container */
        .container {
            padding: 30px;
            max-width: 800px;
            margin: auto;
        }

        h2 {
            text-align: center;
        }

        /* Cart Items */
        .item {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .item button {
            background: red;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .item button:hover {
            background: darkred;
        }

        /* Total */
        .total-box {
            text-align: right;
            font-size: 20px;
            margin-top: 20px;
            font-weight: bold;
        }

        /* Footer */
        .footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <div>🛍️ Roshani's Store</div>
    <a href="checkout.html">Proceed to Checkout</a>
</div>

<!-- Cart -->
<div class="container">

    <h2>Your Cart 🛒</h2>

    <div id="cartItems"></div>

    <div class="total-box">
        Total: ₹<span id="total">0</span>
    </div>

</div>

<!-- Footer -->
<div class="footer">© 2026 Roshani's Store</div>

<script>
let cart = [
    {name: "Product 1", price: 500},
    {name: "Product 2", price: 1000}
];

function displayCart() {
    let container = document.getElementById("cartItems");
    let total = 0;
    container.innerHTML = "";

    cart.forEach((item, index) => {
        total += item.price;

        container.innerHTML += `
            <div class="item">
                <div>${item.name} - ₹${item.price}</div>
                <button onclick="removeItem(${index})">Remove</button>
            </div>
        `;
    });

    document.getElementById("total").innerText = total;
}

function removeItem(index) {
    cart.splice(index, 1);
    displayCart();
}

displayCart();
</script>
</body></html>
